<div class="navbar">
    <div class="navbar-left">
      <div class="search-container" *ngIf="showSearchBar">
        <i class="fas fa-search"></i>
        <input
          type="text"
          placeholder="Search"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
        />
      </div>
    </div>
    <div class="navbar-links">
      <button (click)="logout()">Logout</button>
    </div>
  </div>
