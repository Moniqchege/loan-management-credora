<div class="dashboard">
  <h2 class="dashboard-title">Loan Management Dashboard</h2>

  <div class="row">
    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-left-primary shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                Total Loans
              </div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">
                $1,500,000
              </div>
            </div>
            <div class="col-auto">
              <i class="fas fa-hand-holding-usd fa-2x text-gray-300"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-left-success shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                Approved Loans
              </div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">50</div>
            </div>
            <div class="col-auto">
              <i class="fas fa-check-circle fa-2x text-gray-300"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-left-warning shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                Pending Loans
              </div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">30</div>
            </div>
            <div class="col-auto">
              <i class="fas fa-clock fa-2x text-gray-300"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-left-danger shadow h-100 py-2">
        <div class="card-body">
          <div class="row no-gutters align-items-center">
            <div class="col mr-2">
              <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">
                Rejected Loans
              </div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">5</div>
            </div>
            <div class="col-auto">
              <i class="fas fa-ban fa-2x text-gray-300"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-xl-8 col-lg-7 mb-4">
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">Loan Repayment Progress</h6>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <app-chart
              [chartType]="'line'"
              [chartData]="repaymentProgressData"
              [chartOptions]="repaymentProgressOptions"
            ></app-chart>
          </div>
        </div>
      </div>
    </div>

    <div class="col-xl-4 col-lg-5 mb-4">
      <div class="card shadow mb-4">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">Loan Status Distribution</h6>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <app-chart
              [chartType]="'pie'"
              [chartData]="loanStatusData"
              [chartOptions]="loanStatusOptions"
            ></app-chart>
          </div>
          <hr />
        </div>
      </div>
    </div>
  </div>
<div class="row">
  <div class="col-xl-8 col-lg-7 mb-4">
    <div class="card shadow mb-4">
      <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Loan Amounts by Month</h6>
      </div>
      <div class="card-body">
        <div class="chart-container">
          <app-chart
            [chartType]="'bar'"
            [chartData]="loanAmountsData"
            [chartOptions]="loanAmountsOptions"
          ></app-chart>
        </div>
      </div>
    </div>
  </div>

  
</div>
    
  </div>
